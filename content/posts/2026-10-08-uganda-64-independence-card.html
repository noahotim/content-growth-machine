<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Uganda at 64 - Happy Independence Day</title>
<style>
  :root{
    --blk:#000000;
    --yel:#FCDC04;
    --red:#D90000;
    --wht:#FFFFFF;
    --bg:#0B0B0C;
  }
  *{margin:0;padding:0;box-sizing:border-box;
    print-color-adjust:exact;-webkit-print-color-adjust:exact;}
  html,body{width:1240px;height:1754px;overflow:hidden;background:var(--bg);}
  body{font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;}

  .card{
    position:relative;
    width:1240px;height:1754px;
    background:
      radial-gradient(900px 700px at 8% 4%, rgba(252,220,4,.10), rgba(252,220,4,0) 62%),
      radial-gradient(1000px 800px at 96% 98%, rgba(217,0,0,.22), rgba(217,0,0,0) 60%),
      linear-gradient(180deg,#101013 0%,#0B0B0C 45%,#0E0A0B 100%);
    display:flex;flex-direction:column;
    overflow:hidden;color:#fff;
  }

  .stripes{display:flex;flex-direction:column;flex:none;}
  .stripes span{display:block;height:14px;}
  .s-b{background:var(--blk);}
  .s-y{background:var(--yel);}
  .s-r{background:var(--red);}

  .frame-line{
    position:absolute;inset:30px;
    border:2px solid rgba(252,220,4,.55);
    pointer-events:none;z-index:5;
  }
  .frame-line::after{
    content:"";position:absolute;inset:7px;
    border:1px solid rgba(252,220,4,.25);
  }

  .confetti{position:absolute;width:14px;height:14px;z-index:2;opacity:.9;}
  .c1{top:150px;left:52px;background:var(--yel);transform:rotate(28deg);}
  .c2{top:260px;left:84px;background:var(--red);transform:rotate(-18deg);width:11px;height:11px;}
  .c3{top:430px;left:46px;background:var(--wht);transform:rotate(40deg);width:10px;height:10px;opacity:.75;}
  .c4{top:170px;right:58px;background:var(--red);transform:rotate(-32deg);}
  .c5{top:300px;right:90px;background:var(--yel);transform:rotate(15deg);width:11px;height:11px;}
  .c6{top:1180px;right:52px;background:var(--wht);transform:rotate(24deg);width:10px;height:10px;opacity:.7;}
  .c7{top:1330px;left:60px;background:var(--yel);transform:rotate(-25deg);width:12px;height:12px;}
  .c8{top:1520px;right:78px;background:var(--yel);transform:rotate(35deg);width:11px;height:11px;}
  .c9{top:1600px;left:96px;background:var(--red);transform:rotate(-12deg);width:13px;height:13px;}

  .body{
    position:relative;z-index:6;
    flex:1;display:flex;flex-direction:column;
    align-items:center;justify-content:space-between;
    padding:46px 84px 40px;text-align:center;
  }

  .header{display:flex;flex-direction:column;align-items:center;gap:16px;}
  .kicker{
    font-size:26px;font-weight:700;color:var(--yel);
    letter-spacing:12px;text-transform:uppercase;
  }
  h1{
    font-size:76px;font-weight:800;color:var(--wht);
    letter-spacing:4px;line-height:1.04;text-transform:uppercase;
  }
  .hero{
    font-size:124px;font-weight:800;color:var(--yel);
    letter-spacing:2px;line-height:1;text-transform:uppercase;
    text-shadow:0 7px 0 rgba(160,0,0,.95);
    margin-top:6px;
  }
  .date{
    margin-top:10px;
    background:var(--yel);color:#111;
    font-size:30px;font-weight:800;letter-spacing:6px;
    padding:14px 44px;border-radius:999px;text-transform:uppercase;
  }

  .photos{display:flex;justify-content:center;align-items:center;gap:54px;}
  .frame{
    background:#fff;padding:14px;
    border:4px solid var(--yel);
    border-radius:4px;
    box-shadow:0 22px 46px rgba(0,0,0,.6);
  }
  .frame img{display:block;height:500px;width:auto;border-radius:2px;}
  .frame.a{transform:rotate(-1.6deg);}
  .frame.b{transform:rotate(1.6deg);}

  .message{
    max-width:1000px;
    font-size:35px;line-height:1.5;color:#F4F4F4;
    font-weight:400;
  }
  .message strong{color:var(--yel);font-weight:700;}

  .motto{
    font-family:Georgia,"Times New Roman",serif;
    font-style:italic;font-size:46px;color:var(--yel);
    letter-spacing:1px;
  }
  .motto::before,.motto::after{
    content:"";display:inline-block;width:64px;height:2px;
    background:rgba(252,220,4,.6);vertical-align:middle;margin:0 22px;
  }

  .footer{
    font-size:24px;font-weight:700;color:#C9C9C9;
    letter-spacing:10px;text-transform:uppercase;
  }

  @page{size:A4 portrait;margin:0;}
  @media print{
    html,body{width:210mm;height:297mm;background:#0B0B0C;}
    .card{transform:scale(0.6400813);transform-origin:top left;}
  }
</style>
</head>
