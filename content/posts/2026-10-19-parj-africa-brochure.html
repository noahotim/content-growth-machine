<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='utf-8'>
  <title>PARJ Africa - Indexed Platforms</title>
  <style>
    body { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; margin: 0; background: #fff; color: #0f172a; }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 40px 24px; }
    .header { text-align: center; margin-bottom: 32px; }
    .header h1 { margin: 0; font-size: 32px; color: #0b3d91; }
    .header p { margin: 8px 0 0; color: #475569; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
    .card { border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; display: flex; align-items: center; justify-content: center; min-height: 110px; }
    .card img { max-width: 180px; max-height: 60px; width: 100%; height: auto; }
    .footer { text-align: center; margin-top: 32px; color: #475569; font-size: 14px; }
    .links { text-align: center; margin-top: 16px; }
    .links a { color: #0b3d91; text-decoration: none; margin: 0 8px; }
  </style>
</head>
<body>
  <div class='wrap'>
    <div class='header'>
      <h1>PARJ Africa</h1>
      <p>Indexed & Discoverable Across Leading Scholarly Platforms</p>
      <p>Operated by GEMTECH RESEARCH AND DATA ANALYSIS CO.LTD</p>
    </div>
    <div class='grid'>
      <div class='card'><img src='https://upload.wikimedia.org/wikipedia/commons/thumb/c/cb/Scopus_logo.svg/2560px-Scopus_logo.svg.png' alt='Scopus'></div>
      <div class='card'><img src='https://doaj.org/static/doaj/images/logo_cropped.jpg' alt='DOAJ'></div>
      <div class='card'><img src='https://www.ajol.info/images/AJOL-Logo-JPG.jpg' alt='AJOL'></div>
      <div class='card'><img src='https://upload.wikimedia.org/wikipedia/commons/2/28/Google_Scholar_logo.png' alt='Google Scholar'></div>
      <div class='card'><img src='https://www.dimensions.ai/wp-content/uploads/2023/08/dimensions-logo.png' alt='Dimensions'></div>
      <div class='card'><img src='https://openalex.org/img/OpenAlex-logo-eco-green.png' alt='OpenAlex'></div>
      <div class='card'><img src='https://www.base-search.net/s/logo2.svg' alt='BASE'></div>
      <div class='card'><img src='https://core.ac.uk/images/core-logo.svg' alt='CORE'></div>
      <div class='card'><img src='https://assets.semanticscholar.org/production/images/logo-wordmark.svg' alt='Semantic Scholar'></div>
      <div class='card'><img src='https://www.lens.org/static/img/lens-logo.svg' alt='Lens.org'></div>
      <div class='card'><img src='https://clarivate.com/wp-content/uploads/2022/05/WOS_Logo_Horizontal_RGB_Blue.svg' alt='Web of Science'></div>
      <div class='card'><img src='https://publicationethics.org/sites/default/files/COPE-Logo.svg' alt='COPE'></div>
    </div>
    <div class='links'>
      <a href='https://parj.africa/'>Website</a> | <a href='https://parj.africa/journals'>Journals</a> | <a href='https://app.parj.africa/submit'>Submit</a>
    </div>
    <div class='footer'>Publisher: GEMTECH RESEARCH AND DATA ANALYSIS CO.LTD</div>
  </div>
</body>
</html>
