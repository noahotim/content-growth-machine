<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiverr Gig Image 3</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1280px;
    height: 769px;
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    background: #1a1a2e;
    color: #ffffff;
    padding: 52px 64px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .eyebrow {
    color: #22d3ee;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    text-align: center;
    margin-bottom: 12px;
  }
  h1 {
    font-size: 52px;
    font-weight: 800;
    text-align: center;
    margin-bottom: 44px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 22px;
    margin-bottom: 16px;
  }
  .chip {
    background: rgba(255, 255, 255, 0.06);
    border: 2px solid rgba(148, 163, 184, 0.35);
    border-radius: 16px;
    height: 108px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
    font-weight: 700;
    color: #e2e8f0;
    text-align: center;
    padding: 10px;
  }
  .chip.accent {
    border-color: #22d3ee;
    color: #22d3ee;
    background: rgba(34, 211, 238, 0.10);
  }
  .note {
    text-align: center;
    font-size: 27px;
    font-weight: 700;
    color: #e2e8f0;
    margin-top: 30px;
    margin-bottom: 8px;
  }
  .note span { color: #22d3ee; }
  .footer {
    text-align: center;
    margin-top: auto;
    padding-top: 22px;
    border-top: 2px solid rgba(34, 211, 238, 0.35);
    font-size: 21px;
    color: #94a3b8;
    font-weight: 600;
    letter-spacing: 1px;
  }
  .footer strong { color: #ffffff; }
</style>
</head>
<body>
  <div class="eyebrow">Connects to what you already use</div>
  <h1>Works with your stack</h1>
  <div class="grid">
    <div class="chip accent">OpenAI</div>
    <div class="chip">Slack</div>
    <div class="chip">Google Sheets</div>
    <div class="chip">Notion</div>
    <div class="chip">WhatsApp</div>
    <div class="chip">n8n</div>
    <div class="chip">Make</div>
    <div class="chip">Zapier</div>
    <div class="chip">HubSpot</div>
    <div class="chip">Custom APIs</div>
  </div>
  <div class="note">No migration. No lock-in. <span>You own the code.</span></div>
  <div class="footer"><strong>NOAH OTIM</strong> &nbsp;|&nbsp; AI agents and workflow automation, built to spec</div>
</body>
</html>
